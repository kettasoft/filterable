name: Tests

on:
  push:
    branches: ["master", "develop"]
    paths:
      - "src/**"
      - "tests/**"
      - "database/**"
      - "config/**"
      - "stubs/**"
      - "composer.json"
      - "composer.lock"
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "src/**"
      - "tests/**"
      - "database/**"
      - "config/**"
      - "stubs/**"
      - "composer.json"
      - "composer.lock"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: "10"
            php: "8.2"
            illuminate: "^10.50"
            testbench: "^8.40"
          - laravel: "11"
            php: "8.2"
            illuminate: "^11.50"
            testbench: "^9.20"
          - laravel: "12"
            php: "8.3"
            illuminate: "^12.55"
            testbench: "^10.11"
          - laravel: "13"
            php: "8.3"
            illuminate: "^13.0"
            testbench: "^11.0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      - name: Install Laravel ${{ matrix.laravel }} dependencies
        run: >-
          composer update
          "illuminate/database:${{ matrix.illuminate }}"
          "illuminate/support:${{ matrix.illuminate }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          --with-all-dependencies
          --prefer-dist
          --no-interaction
          --no-progress

      - name: Run test suite
        run: composer test
